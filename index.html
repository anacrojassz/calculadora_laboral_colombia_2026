<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nómina Colombia · Calculadora Laboral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16213A;
  --ink-soft:#445068;
  --paper:#F5F3EC;
  --paper-alt:#ECE8DB;
  --card:#FFFFFF;
  --line:#D9D2C0;
  --sidebar-bg:#E3D5B8;
  --sidebar-bg-soft:#D8C7A2;
  --sidebar-ink:#3A2E1E;
  --sidebar-ink-soft:#6B5C42;
  --gold:#C96B56;
  --gold-soft:#F5DAD1;
  --gold-ink:#3A160E;
  --green:#2F6B4F;
  --green-soft:#E3EEE7;
  --red:#A23B3B;
  --red-soft:#F5E6E4;
  --radius:10px;
  --display:'Fraunces', serif;
  --body:'IBM Plex Sans', sans-serif;
  --mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:var(--mono);}
a{color:var(--gold);}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:248px;flex:none;
  background:var(--sidebar-bg);
  color:var(--sidebar-ink);
  padding:28px 0 20px;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.brand{padding:0 24px 22px;border-bottom:1px solid rgba(58,46,30,.15);margin-bottom:8px;}
.brand-mark{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.2px;color:var(--sidebar-ink);}
.brand-sub{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--sidebar-ink-soft);margin-top:4px;}
.nav{list-style:none;margin:8px 0 0;padding:0;flex:1;}
.nav li{margin:2px 10px;}
.nav button{
  width:100%;text-align:left;background:none;border:none;color:var(--sidebar-ink-soft);
  padding:11px 14px;border-radius:8px;font-size:13.5px;font-weight:500;
  display:flex;align-items:center;gap:10px;transition:background .15s,color .15s;
}
.nav button .num{font-family:var(--mono);font-size:11px;color:var(--sidebar-ink-soft);width:16px;flex:none;opacity:.7;}
.nav button:hover{background:rgba(58,46,30,.08);color:var(--sidebar-ink);}
.nav button.active{background:var(--gold);color:var(--gold-ink);font-weight:600;}
.nav button.active .num{color:var(--gold-ink);opacity:.7;}
.sidebar-foot{padding:14px 24px 0;border-top:1px solid rgba(58,46,30,.15);font-size:11px;color:var(--sidebar-ink-soft);line-height:1.6;}

.main{flex:1;min-width:0;padding:0;}
.topbar{
  background:var(--paper-alt);border-bottom:1px solid var(--line);
  padding:16px 36px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
}
.stamp{
  border:1.5px dashed var(--gold);border-radius:10px;
  padding:8px 16px;
  font-family:var(--mono);font-size:11.5px;color:var(--ink);
  background:var(--gold-soft);display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;line-height:1.4;
}
.stamp span{display:inline-flex;align-items:baseline;gap:5px;}
.stamp b{color:var(--gold);font-size:11px;letter-spacing:.05em;text-transform:uppercase;}
.topbar-title{font-family:var(--display);font-weight:600;font-size:19px;}

.content{padding:32px 36px 80px;max-width:1180px;}
.tab-mobile{display:none;}

h1.page-title{font-family:var(--display);font-weight:600;font-size:30px;margin:0 0 6px;color:var(--ink);}
p.page-sub{color:var(--ink-soft);margin:0 0 28px;font-size:14.5px;max-width:640px;}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px 24px;margin-bottom:22px;
  max-width:100%;overflow-x:auto;
}
.card h2{font-family:var(--display);font-size:17px;font-weight:600;margin:0 0 4px;}
.card .card-note{color:var(--ink-soft);font-size:12.5px;margin:0 0 16px;}
.section-label{
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--gold);font-weight:600;margin:0 0 14px;display:flex;align-items:center;gap:8px;
}
.section-label::after{content:"";flex:1;height:1px;background:var(--line);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px 18px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:12px;color:var(--ink-soft);font-weight:500;}
.field input[type=text],.field input[type=number],.field input[type=date],.field select{
  border:1px solid var(--line);border-radius:7px;padding:9px 10px;font-size:13.5px;
  background:#fff;color:var(--ink);
}
.field input:focus,.field select:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold);}
.checkbox-row{display:flex;align-items:center;gap:8px;padding-top:6px;}
.checkbox-row input{width:16px;height:16px;}
.checkbox-row label{font-size:13px;color:var(--ink);}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{
  text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-soft);border-bottom:1.5px solid var(--line);padding:8px 10px;font-weight:600;
  overflow-wrap:break-word;word-break:break-word;
}
td{padding:9px 10px;border-bottom:1px solid var(--line);overflow-wrap:break-word;word-break:break-word;}
td.num,th.num{text-align:right;font-family:var(--mono);}
tr.total td{font-weight:700;border-top:1.5px solid var(--ink);border-bottom:none;}
tr.total td.num{font-family:var(--mono);}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-family:var(--mono);}
.tag.green{background:var(--green-soft);color:var(--green);}
.tag.red{background:var(--red-soft);color:var(--red);}
.tag.gold{background:var(--gold-soft);color:var(--gold);}
.tag.grey{background:var(--paper-alt);color:var(--ink-soft);border:1px solid var(--line);}

.result-strip{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px;}
.result-box{
  flex:1;min-width:160px;background:var(--paper-alt);border-radius:8px;padding:14px 16px;border:1px solid var(--line);
}
.result-box .k{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;font-family:var(--mono);}
.result-box .v{font-family:var(--mono);font-size:20px;font-weight:600;margin-top:4px;color:var(--ink);}
.result-box.neto{background:var(--green-soft);border-color:var(--green);}
.result-box.neto .v{color:var(--green);}
.result-box.total{background:var(--gold-soft);border-color:var(--gold);}
.result-box.total .v{color:var(--gold-ink);}

.btn{
  border:none;border-radius:7px;padding:9px 16px;font-size:13px;font-weight:600;
  background:var(--ink);color:#fff;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{background:#233255;}
.btn.gold{background:var(--gold);color:var(--gold-ink);}
.btn.gold:hover{background:#A8543F;}
.btn.ghost{background:none;color:var(--ink-soft);border:1px solid var(--line);}
.btn.ghost:hover{border-color:var(--ink);color:var(--ink);}
.btn.small{padding:5px 10px;font-size:12px;}
.btn.danger{background:none;color:var(--red);border:1px solid var(--red-soft);}

.hr{height:1px;background:var(--line);margin:22px 0;border:none;}
.note{font-size:12px;color:var(--ink-soft);background:var(--paper-alt);border-left:3px solid var(--gold);padding:9px 12px;border-radius:0 6px 6px 0;margin-top:14px;}

.tramo-card{border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px;background:var(--paper-alt);}
.tramo-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.tramo-head span{font-family:var(--mono);font-size:11px;color:var(--ink-soft);text-transform:uppercase;}
.tramo-result{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-family:var(--mono);font-size:12px;}
.tramo-result b{color:var(--ink-soft);font-weight:500;}

.hist-table td,.hist-table th{font-size:12.5px;}

@media print{
  .sidebar,.topbar,.no-print{display:none !important;}
  .content{padding:0;max-width:100%;}
  body{background:#fff;}
}

@media (max-width:860px){
  .sidebar{display:none;}
  .tab-mobile{
    display:flex;overflow-x:auto;gap:6px;padding:10px 14px;background:var(--sidebar-bg);
    position:sticky;top:0;z-index:10;
  }
  .tab-mobile button{
    flex:none;background:rgba(58,46,30,.07);color:var(--sidebar-ink-soft);border:none;border-radius:20px;
    padding:8px 14px;font-size:12.5px;white-space:nowrap;
  }
  .tab-mobile button.active{background:var(--gold);color:var(--gold-ink);font-weight:600;}
  .content{padding:20px 16px 60px;}
  .topbar{padding:12px 16px;}
}
.brand-watermark{font-family:var(--mono);font-size:10px;letter-spacing:.03em;color:var(--sidebar-ink-soft);margin-top:10px;line-height:1.6;}
.watermark-doc{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-25deg);
  font-family:var(--display);font-size:90px;font-weight:700;color:rgba(201,107,86,0.09);
  pointer-events:none;z-index:0;white-space:nowrap;
}
textarea{font-family:var(--body);}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ==========================================================================
// MOTOR DE CALCULO — Normativa laboral y de seguridad social de Colombia
// (validado contra la hoja de cálculo Excel del mismo proyecto)
// ==========================================================================
const HISTORICO_SMMLV = [
  { year: 2016, smmlv: 689455,   aux: 77700  },
  { year: 2017, smmlv: 737717,   aux: 83140  },
  { year: 2018, smmlv: 781242,   aux: 88211  },
  { year: 2019, smmlv: 828116,   aux: 97032  },
  { year: 2020, smmlv: 877803,   aux: 102854 },
  { year: 2021, smmlv: 908526,   aux: 106454 },
  { year: 2022, smmlv: 1000000,  aux: 117172 },
  { year: 2023, smmlv: 1160000,  aux: 140606 },
  { year: 2024, smmlv: 1300000,  aux: 162000 },
  { year: 2025, smmlv: 1423500,  aux: 200000 },
  { year: 2026, smmlv: 1750905,  aux: 249095 },
];
const JORNADA = [
  { desde: '2000-01-01', hasta: '2023-07-15', horasSemana: 48, divisor: 240 },
  { desde: '2023-07-16', hasta: '2024-07-15', horasSemana: 47, divisor: 235 },
  { desde: '2024-07-16', hasta: '2025-07-15', horasSemana: 46, divisor: 230 },
  { desde: '2025-07-16', hasta: '2026-07-14', horasSemana: 44, divisor: 220 },
  { desde: '2026-07-15', hasta: '2099-12-31', horasSemana: 42, divisor: 210 },
];
const DOMINICAL = [
  { desde: '2000-01-01', hasta: '2025-06-30', pct: 0.75 },
  { desde: '2025-07-01', hasta: '2026-06-30', pct: 0.80 },
  { desde: '2026-07-01', hasta: '2027-06-30', pct: 0.90 },
  { desde: '2027-07-01', hasta: '2099-12-31', pct: 1.00 },
];
const ARL = { I: 0.00522, II: 0.01044, III: 0.02436, IV: 0.0435, V: 0.0696 };
const RATES = {
  recargoNocturno: 0.35, extraDiurna: 0.25, extraNocturna: 0.75,
  saludEmpleado: 0.04, saludEmpleador: 0.085, pensionEmpleado: 0.04, pensionEmpleador: 0.12,
  caja: 0.04, sena: 0.02, icbf: 0.03,
  cesantias: 0.0833, interesesCesantias: 0.12, prima: 0.0833, vacaciones: 0.0417,
  topeAuxSMMLV: 2, topeDotacionSMMLV: 2, topeParafiscalSMMLV: 10,
};
function d(dateStr){ return new Date(dateStr + 'T00:00:00'); }
function findInRange(table, dateStr, key){
  const t = d(dateStr).getTime();
  for (const row of table){ if (t >= d(row.desde).getTime() && t <= d(row.hasta).getTime()) return row[key]; }
  return table[table.length - 1][key];
}
function getSMMLV(dateStr){
  const year = d(dateStr).getFullYear();
  let row = HISTORICO_SMMLV.find(r => r.year === year);
  if (!row) row = year < HISTORICO_SMMLV[0].year ? HISTORICO_SMMLV[0] : HISTORICO_SMMLV[HISTORICO_SMMLV.length - 1];
  return { smmlv: row.smmlv, aux: row.aux };
}
function getDivisorHoras(dateStr){ return findInRange(JORNADA, dateStr, 'divisor'); }
function getRecargoDominical(dateStr){ return findInRange(DOMINICAL, dateStr, 'pct'); }
function daysBetween(inicio, fin){ return Math.round((d(fin).getTime() - d(inicio).getTime()) / 86400000); }

// -------------------- Festivos de Colombia (Ley Emiliani + Ley 2578 de 2026) --------------------
function easterDate(year){
  const a = year % 19, b = Math.floor(year/100), c = year % 100;
  const dd = Math.floor(b/4), e = b % 4, f = Math.floor((b+8)/25), g = Math.floor((b-f+1)/3);
  const h = (19*a+b-dd-g+15) % 30, i = Math.floor(c/4), k = c % 4;
  const l = (32+2*e+2*i-h-k) % 7, m = Math.floor((a+11*h+22*l)/451);
  const month = Math.floor((h+l-7*m+114)/31), day = ((h+l-7*m+114) % 31) + 1;
  return new Date(year, month-1, day);
}
function toEmilianiMonday(date){
  const dow = date.getDay();
  if(dow===1) return date;
  const diff = (8-dow)%7;
  const d2 = new Date(date); d2.setDate(d2.getDate()+(diff===0?7:diff));
  return d2;
}
function addDaysDate(date,n){ const d2=new Date(date); d2.setDate(d2.getDate()+n); return d2; }
function isoDate(dt){ return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
const _festivosCache = {};
function getFestivos(year){
  if(_festivosCache[year]) return _festivosCache[year];
  const list=[];
  const add=(m,dd)=>list.push(new Date(year,m-1,dd));
  add(1,1); add(5,1); add(7,20); add(8,7); add(12,8); add(12,25);
  const movableFixed=[[1,6],[3,19],[6,29],[8,15],[10,12],[11,1],[11,11]];
  if(year>=2026) movableFixed.push([7,9]); // Ley 2578 de 2026 - Virgen de Chiquinquira
  movableFixed.forEach(([m,dd])=>list.push(toEmilianiMonday(new Date(year,m-1,dd))));
  const e = easterDate(year);
  list.push(addDaysDate(e,-3)); // Jueves Santo
  list.push(addDaysDate(e,-2)); // Viernes Santo
  list.push(toEmilianiMonday(addDaysDate(e,39))); // Ascension
  list.push(toEmilianiMonday(addDaysDate(e,60))); // Corpus Christi
  list.push(toEmilianiMonday(addDaysDate(e,68))); // Sagrado Corazon
  const isoList = list.map(isoDate).sort();
  _festivosCache[year] = isoList;
  return isoList;
}
function esFestivo(dateStr){
  const year = parseInt(dateStr.slice(0,4),10);
  return getFestivos(year).includes(dateStr);
}
function esDomingoOFestivo(dateStr){
  return d(dateStr).getDay()===0 || esFestivo(dateStr);
}

// -------------------- Division de un turno en segmentos diurno/nocturno x fecha --------------------
function toMinutesOfDay(hhmm){ const [h,m]=hhmm.split(':').map(Number); return h*60+(m||0); }
function addDaysISO(fecha,n){ const dt=d(fecha); dt.setDate(dt.getDate()+n); return isoDate(dt); }
// almuerzoInicio ('HH:MM') y almuerzoMin (duracion en minutos) descuentan una ventana no paga
// del turno; esa ventana no genera horas en ninguna categoria y no cuenta como jornada laboral.
function splitTurno(fecha, horaInicio, horaFin, almuerzoInicio, almuerzoMin){
  let startMin = toMinutesOfDay(horaInicio);
  let endMin = toMinutesOfDay(horaFin);
  if(endMin<=startMin) endMin += 1440; // cruza medianoche
  almuerzoMin = almuerzoMin || 0;
  let almStart = null, almEnd = null;
  if(almuerzoMin > 0 && almuerzoInicio){
    almStart = toMinutesOfDay(almuerzoInicio);
    if(almStart < startMin) almStart += 1440;
    almEnd = almStart + almuerzoMin;
    // si la ventana de almuerzo cae fuera del turno, se ignora (no aplica)
    if(almStart < startMin || almEnd > endMin){ almStart = null; almEnd = null; }
  }
  const dayCount = Math.ceil(endMin/1440)+1;
  const boundariesSet = new Set([startMin,endMin]);
  for(let day=0; day<dayCount; day++){
    const base = day*1440;
    [0,360,1140,1440].forEach(off=>{ const t=base+off; if(t>startMin && t<endMin) boundariesSet.add(t); });
  }
  if(almStart!==null){ boundariesSet.add(almStart); boundariesSet.add(almEnd); }
  const sorted = Array.from(boundariesSet).sort((a,b)=>a-b);
  const segments = [];
  for(let i=0;i<sorted.length-1;i++){
    const segStart=sorted[i], segEnd=sorted[i+1];
    if(segEnd<=segStart) continue;
    const mid=(segStart+segEnd)/2;
    if(almStart!==null && mid>=almStart && mid<almEnd) continue; // ventana de almuerzo: no paga, se excluye
    const dayOffset=Math.floor(mid/1440);
    const minuteOfDay=mid-dayOffset*1440;
    const esNocturno = minuteOfDay<360 || minuteOfDay>=1140;
    segments.push({ fecha: addDaysISO(fecha,dayOffset), durHoras:(segEnd-segStart)/60, esNocturno });
  }
  return segments;
}
// Calcula, para un turno { fecha, horaInicio, horaFin, diaNoHabitual, esDescanso, almuerzoInicio,
// almuerzoMin }, cuantas horas caen en cada categoria usada por el Simulador de Nomina. Si esDescanso
// es true, el dia se paga como un dia ordinario dentro del salario mensual y no genera ninguna hora
// de recargo o extra (por ejemplo, el dia de descanso semanal remunerado). El tiempo de almuerzo se
// descuenta antes de clasificar. Dentro de cada turno, las primeras `jornadaOrdinariaDiaria` horas
// trabajadas se consideran ordinarias (solo generan recargo si son nocturnas o si el dia es
// domingo/festivo); todo lo que exceda ese umbral se considera hora extra (con el recargo de ley
// correspondiente segun sea diurna, nocturna, dominical/festiva diurna o dominical/festiva nocturna).
// Si diaNoHabitual es true, el turno completo se trata como extra (por ejemplo, si llamaron al
// empleado un dia que no le correspondia trabajar segun su horario habitual).
function calcularTurno(turno, jornadaOrdinariaDiaria){
  const res = {heDiurnas:0,heNocturnas:0,heDomDiurnas:0,heDomNocturnas:0,recNocturno:0,recDomDiurno:0,recDomNocturno:0,totalHoras:0};
  if(turno.esDescanso) return res;
  const segs = splitTurno(turno.fecha, turno.horaInicio, turno.horaFin, turno.almuerzoInicio, turno.almuerzoMin);
  const umbral = turno.diaNoHabitual ? 0 : (jornadaOrdinariaDiaria || 0);
  let acumulado = 0;
  segs.forEach(seg=>{
    res.totalHoras += seg.durHoras;
    const festivo = esDomingoOFestivo(seg.fecha);
    const restanteOrdinario = Math.max(0, umbral - acumulado);
    const horasOrdinarias = Math.min(seg.durHoras, restanteOrdinario);
    const horasExtra = seg.durHoras - horasOrdinarias;
    acumulado += seg.durHoras;
    if(horasOrdinarias > 0){
      if(festivo){ if(seg.esNocturno) res.recDomNocturno+=horasOrdinarias; else res.recDomDiurno+=horasOrdinarias; }
      else { if(seg.esNocturno) res.recNocturno+=horasOrdinarias; /* diurno ordinario en dia habil: ya incluido en el salario */ }
    }
    if(horasExtra > 0){
      if(festivo){ if(seg.esNocturno) res.heDomNocturnas+=horasExtra; else res.heDomDiurnas+=horasExtra; }
      else { if(seg.esNocturno) res.heNocturnas+=horasExtra; else res.heDiurnas+=horasExtra; }
    }
  });
  return res;
}
function calcularTotalesTurnos(lista, jornadaOrdinariaDiaria){
  const tot = {heDiurnas:0,heNocturnas:0,heDomDiurnas:0,heDomNocturnas:0,recNocturno:0,recDomDiurno:0,recDomNocturno:0};
  const detalle = lista.map(t=>{
    const r = calcularTurno(t, jornadaOrdinariaDiaria);
    Object.keys(tot).forEach(k=>tot[k]+=r[k]);
    return Object.assign({}, t, r);
  });
  return { detalle, tot };
}


function liquidarPeriodo(input){
  const { salario, fecha, diasLaborados, recibeAux,
          heDiurnas=0, heNocturnas=0, heDomDiurnas=0, heDomNocturnas=0,
          recNocturno=0, recDomDiurno=0, recDomNocturno=0,
          bonificaciones=0, prestamos=0, otrosDescuentos=0,
          exoneradoParafiscales=true, claseRiesgo='I' } = input;
  const { smmlv, aux: auxVigente } = getSMMLV(fecha);
  const divisor = getDivisorHoras(fecha);
  const pctDom = getRecargoDominical(fecha);
  const valorHora = salario / divisor;
  const topeAux = smmlv * RATES.topeAuxSMMLV;
  const aux = recibeAux ? auxVigente : 0;
  const salarioDevengado = salario * diasLaborados / 30;
  const auxProporcional = aux * diasLaborados / 30;
  const valorHeDiurnas = heDiurnas * valorHora * (1 + RATES.extraDiurna);
  const valorHeNocturnas = heNocturnas * valorHora * (1 + RATES.extraNocturna);
  const valorHeDomDiurnas = heDomDiurnas * valorHora * (1 + RATES.extraDiurna + pctDom);
  const valorHeDomNocturnas = heDomNocturnas * valorHora * (1 + RATES.extraNocturna + pctDom);
  const valorRecNocturno = recNocturno * valorHora * RATES.recargoNocturno;
  const valorRecDomDiurno = recDomDiurno * valorHora * pctDom;
  const valorRecDomNocturno = recDomNocturno * valorHora * (pctDom + RATES.recargoNocturno);
  const totalDevengado = salarioDevengado + auxProporcional + valorHeDiurnas + valorHeNocturnas +
    valorHeDomDiurnas + valorHeDomNocturnas + valorRecNocturno + valorRecDomDiurno + valorRecDomNocturno + bonificaciones;
  const ibc = totalDevengado - auxProporcional;
  const dedSalud = ibc * RATES.saludEmpleado;
  const dedPension = ibc * RATES.pensionEmpleado;
  const totalDeducciones = dedSalud + dedPension + prestamos + otrosDescuentos;
  const neto = totalDevengado - totalDeducciones;
  const exonera = exoneradoParafiscales && salario < smmlv * RATES.topeParafiscalSMMLV;
  const saludEmpleador = exonera ? 0 : ibc * RATES.saludEmpleador;
  const pensionEmpleador = ibc * RATES.pensionEmpleador;
  const arl = ibc * (ARL[claseRiesgo] ?? ARL.I);
  const caja = ibc * RATES.caja;
  const sena = exonera ? 0 : ibc * RATES.sena;
  const icbf = exonera ? 0 : ibc * RATES.icbf;
  const totalAportes = saludEmpleador + pensionEmpleador + arl + caja + sena + icbf;
  const costoTotalPeriodo = totalDevengado + totalAportes;
  return { smmlv, divisor, pctDom, valorHora, topeAux, salarioDevengado, auxProporcional,
    valorHeDiurnas, valorHeNocturnas, valorHeDomDiurnas, valorHeDomNocturnas,
    valorRecNocturno, valorRecDomDiurno, valorRecDomNocturno, bonificaciones, totalDevengado, ibc,
    dedSalud, dedPension, prestamos, otrosDescuentos, totalDeducciones, neto,
    saludEmpleador, pensionEmpleador, arl, caja, sena, icbf, totalAportes, costoTotalPeriodo };
}
function liquidarVacaciones(salario, fechaInicio, fechaFin){
  const dias = daysBetween(fechaInicio, fechaFin);
  return { dias, diasCausados: dias/24, valor: salario*dias/720 };
}
function liquidarCesantiasPrima(salario, aux, fechaInicio, fechaFin){
  const dias = daysBetween(fechaInicio, fechaFin);
  const base = salario + aux;
  const cesantias = base*dias/360;
  const intereses = cesantias*(dias/360)*RATES.interesesCesantias;
  return { dias, base, cesantias, intereses, prima: cesantias };
}
function costoTotalEmpleado(input){
  const { salario, recibeAux, fechaRef, exoneradoParafiscales=true, claseRiesgo='I',
          recibeDotacion=false, valorDotacion=0, entregasDotacion=3,
          otorgaAguinaldo=false, valorAguinaldo=0 } = input;
  const { smmlv, aux: auxVigente } = getSMMLV(fechaRef);
  const aux = recibeAux ? auxVigente : 0;
  const exonera = exoneradoParafiscales && salario < smmlv*RATES.topeParafiscalSMMLV;
  const saludEmpleador = exonera ? 0 : salario*RATES.saludEmpleador;
  const pensionEmpleador = salario*RATES.pensionEmpleador;
  const arl = salario*(ARL[claseRiesgo] ?? ARL.I);
  const caja = salario*RATES.caja;
  const sena = exonera ? 0 : salario*RATES.sena;
  const icbf = exonera ? 0 : salario*RATES.icbf;
  const totalAportes = saludEmpleador+pensionEmpleador+arl+caja+sena+icbf;
  const provCesantias = (salario+aux)*RATES.cesantias;
  const provIntereses = provCesantias*RATES.interesesCesantias;
  const provPrima = (salario+aux)*RATES.prima;
  const provVacaciones = salario*RATES.vacaciones;
  const dotacionMensual = recibeDotacion ? (valorDotacion*entregasDotacion/12) : 0;
  const aguinaldoMensual = otorgaAguinaldo ? (valorAguinaldo/12) : 0;
  const costoTotalMensual = salario+aux+totalAportes+provCesantias+provIntereses+provPrima+provVacaciones+dotacionMensual+aguinaldoMensual;
  const reservaMensual = provCesantias+provIntereses+provPrima+provVacaciones;
  return { smmlv, aux, exonera, saludEmpleador, pensionEmpleador, arl, caja, sena, icbf, totalAportes,
    provCesantias, provIntereses, provPrima, provVacaciones, dotacionMensual, aguinaldoMensual, costoTotalMensual, reservaMensual };
}

// Estimacion de referencia de lo que el empleador tendria que asumir si dejo de pagar los aportes a
// seguridad social y parafiscales durante un numero de meses. Incluye el 100% del aporte mensual
// obligatorio (salud 12.5%, pension 16%, ARL, caja, SENA/ICBF si no esta exonerado) porque, en la
// practica, cuando el empleador nunca reporto la planilla, termina debiendo tanto su parte como la del
// trabajador para poder regularizar la historia laboral. NO incluye posibles gastos medicos reales,
// pension de invalidez, ni la sancion de la UGPP, que se calculan caso por caso; ver las notas de la
// interfaz y la pestana Normativa Legal.
function calcularMoraSeguridadSocial(input){
  const { salario, mesesMora, claseRiesgo, tasaMoraMensual } = input;
  const salud = salario * (RATES.saludEmpleado + RATES.saludEmpleador);
  const pension = salario * (RATES.pensionEmpleado + RATES.pensionEmpleador);
  const arl = salario * (ARL[claseRiesgo] ?? ARL.I);
  const caja = salario * RATES.caja;
  const sena = salario * RATES.sena;
  const icbf = salario * RATES.icbf;
  const aportesMensuales = salud + pension + arl + caja + sena + icbf;
  const totalAportes = aportesMensuales * (mesesMora || 0);
  const interesEstimado = totalAportes * (tasaMoraMensual || 0) * (mesesMora || 0);
  const totalEstimado = totalAportes + interesEstimado;
  return { aportesMensuales, totalAportes, interesEstimado, totalEstimado };
}
// Calcula un año (tramo) del contrato, descontando lo que ya se le pago o consigno al empleado
// durante ese mismo año (cesantias ya consignadas al fondo, primas ya pagadas semestralmente,
// vacaciones ya disfrutadas/compensadas) y cualquier prestamo que la empresa le haya otorgado y que
// deba descontarse. El resultado distingue lo "causado" (lo que la ley genero ese año) de lo
// "pendiente" (lo que realmente falta por pagar), para que la liquidacion final no duplique valores
// que el empleado ya recibio en años anteriores.
function liquidarTramo(t){
  const { salario, recibeAux, fechaInicio, fechaFin,
          cesantiasPagadas=0, primaPagada=0, vacacionesPagadas=0, prestamo=0 } = t;
  const dias = daysBetween(fechaInicio, fechaFin);
  const { aux: auxVigente } = getSMMLV(fechaInicio);
  const aux = recibeAux ? auxVigente : 0;
  const base = salario+aux;
  const cesantiasCausadas = base*dias/360;
  const cesantiasPendientes = Math.max(0, cesantiasCausadas - cesantiasPagadas);
  const intereses = cesantiasPendientes*(dias/360)*RATES.interesesCesantias;
  const primaCausada = base*dias/360;
  const primaPendiente = Math.max(0, primaCausada - primaPagada);
  const vacacionesCausadas = salario*dias/720;
  const vacacionesPendientes = Math.max(0, vacacionesCausadas - vacacionesPagadas);
  const totalAño = cesantiasPendientes + intereses + primaPendiente + vacacionesPendientes - prestamo;
  return { dias, aux, cesantiasCausadas, cesantiasPendientes, intereses, primaCausada, primaPendiente,
           vacacionesCausadas, vacacionesPendientes, prestamo, totalAño,
           // alias por compatibilidad con nombres anteriores
           cesantias: cesantiasCausadas, prima: primaCausada, vacaciones: vacacionesCausadas };
}
function liquidarContrato(tramos, salariosPendientes=0){
  const acc = { totalDias:0, cesantiasCausadas:0, cesantiasPendientes:0, totalIntereses:0,
                primaCausada:0, primaPendiente:0, vacacionesCausadas:0, vacacionesPendientes:0, totalPrestamos:0 };
  const detalle = tramos.map(t=>{
    const r = liquidarTramo(t);
    acc.totalDias += r.dias;
    acc.cesantiasCausadas += r.cesantiasCausadas;
    acc.cesantiasPendientes += r.cesantiasPendientes;
    acc.totalIntereses += r.intereses;
    acc.primaCausada += r.primaCausada;
    acc.primaPendiente += r.primaPendiente;
    acc.vacacionesCausadas += r.vacacionesCausadas;
    acc.vacacionesPendientes += r.vacacionesPendientes;
    acc.totalPrestamos += r.prestamo;
    return Object.assign({}, t, r);
  });
  const total = acc.cesantiasPendientes + acc.totalIntereses + acc.primaPendiente + acc.vacacionesPendientes
                - acc.totalPrestamos + salariosPendientes;
  return Object.assign({ detalle, total, salariosPendientes }, acc);
}

// -------------------- Liquidacion con salario variable (recargos, horas extra habituales) --------------------
// Cuando el ingreso mensual del empleado cambia por horas extra o recargos habituales, la ley no usa
// un salario fijo para liquidar, sino el PROMEDIO de lo realmente devengado — y cada prestacion usa
// su propia ventana de promedio: cesantias e intereses = ultimos 12 meses (o el tiempo trabajado si es
// menor); prima = ultimos 6 meses (el semestre correspondiente); vacaciones = ultimos 12 meses, pero
// EXCLUYENDO horas extra y el pago por trabajo dominical/festivo (el recargo nocturno si se incluye).
// Fuentes: Art. 253 CST (cesantias), Art. 306 y 127 CST (prima), Art. 192 CST (vacaciones).
function calcularLiquidacionVariable(meses){
  const ordenados = meses.filter(m=>m.mes).slice().sort((a,b)=> a.mes.localeCompare(b.mes));
  const n = ordenados.length;
  if(n===0){
    return { n:0, diasTotales:0, promedioCesantias:0, promedioPrima:0, promedioVacaciones:0,
             cesantias:0, intereses:0, prima:0, vacaciones:0, total:0, ordenados:[] };
  }
  const ultimos12 = ordenados.slice(-12);
  const ultimos6 = ordenados.slice(-6);
  const sum = (arr,key) => arr.reduce((s,m)=>s+(Number(m[key])||0),0);
  const promedioCesantias = sum(ultimos12,'devengado') / ultimos12.length;
  const promedioPrima = sum(ultimos6,'devengado') / ultimos6.length;
  const baseVacMes = ordenados.map(m=> Math.max(0, (Number(m.devengado)||0) - (Number(m.extrasYDominical)||0)));
  const baseVacUlt12 = baseVacMes.slice(-12);
  const promedioVacaciones = baseVacUlt12.reduce((a,b)=>a+b,0) / baseVacUlt12.length;

  const diasTotales = n*30; // convencion comercial: cada mes ingresado equivale a 30 dias
  const diasSemestre = Math.min(n,6)*30;

  const cesantias = promedioCesantias * diasTotales/360;
  const intereses = cesantias * (diasTotales/360) * RATES.interesesCesantias;
  const prima = promedioPrima * diasSemestre/360;
  const vacaciones = promedioVacaciones * diasTotales/720;
  const total = cesantias + intereses + prima + vacaciones;

  return { n, diasTotales, promedioCesantias, promedioPrima, promedioVacaciones,
           cesantias, intereses, prima, vacaciones, total, ordenados };
}

// Cuando se trabajan mas de 5 dias a la semana (tipicamente 6, con sabado), el patron habitual en
// Colombia es: los primeros 5 dias tienen una jornada fija (horasEntreSemana) y el/los dia(s)
// restante(s) —el sabado— absorbe(n) lo que falte para completar las horas ordinarias semanales.
function hayDiaCorto(){ return state.turnos.diasLaboralesSemana > 5; }
function diasCortosCount(){ return Math.max(0, state.turnos.diasLaboralesSemana - 5); }
function horasDiaCortoCalculada(){
  const n = diasCortosCount();
  if(n<=0) return 0;
  const restante = state.turnos.horasOrdinariasSemanales - state.turnos.horasEntreSemana*5;
  return restante / n;
}
function jornadaDiariaCalculada(){
  if(hayDiaCorto()) return state.turnos.horasEntreSemana;
  const dias = state.turnos.diasLaboralesSemana;
  if(!dias) return 0;
  return state.turnos.horasOrdinariasSemanales / dias;
}
function horasATexto(horasDecimal){
  const horas = Math.floor(horasDecimal);
  const minutos = Math.round((horasDecimal - horas) * 60);
  if(minutos===0) return horas + ' h';
  return horas + ' h ' + minutos + ' min';
}
function usarJornadaCalculada(){
  const v = jornadaDiariaCalculada();
  if(v>0) state.turnos.jornadaOrdinariaDiaria = Math.round(v*100)/100;
  render();
}

function updPatronDia(diaKey, field, value){
  state.turnos.generador.patron[diaKey][field] = value;
  // Sincroniza el conteo de dias laborales por semana con el patron, como valor de partida
  // conveniente; el usuario puede seguir sobreescribiendolo libremente despues (5, 6 dias, etc.).
  if(field==='activo'){
    state.turnos.diasLaboralesSemana = contarDiasActivosPatron();
    usarJornadaCalculada();
  }
  render();
}

// -------------------- Simulador de horario: hora de ingreso + almuerzo -> hora de salida --------------------
// Suma minutos a una hora "HH:MM" y devuelve tanto la hora resultante como si cruzo la medianoche
// (para poder avisarle al usuario, ya que un turno diario normal no deberia cruzar el dia).
function sumarMinutosAHora(hhmm, minutosASumar){
  const base = toMinutesOfDay(hhmm) + minutosASumar;
  const cruzaMedianoche = base >= 1440;
  const total = ((base % 1440) + 1440) % 1440;
  const hh = String(Math.floor(total/60)).padStart(2,'0');
  const mm = String(total%60).padStart(2,'0');
  return { horaTexto: hh+':'+mm, cruzaMedianoche };
}
function calcularHoraSalida(horaIngreso, horasTrabajo, almuerzoMin){
  const minutos = Math.round((horasTrabajo||0)*60) + (almuerzoMin||0);
  return sumarMinutosAHora(horaIngreso, minutos);
}
function updSimHorario(field, value){
  state.turnos.simHorario[field] = value;
  render();
}
function updSimHorarioDia(diaKey, checked){
  state.turnos.simHorario.dias[diaKey] = checked;
  render();
}
// Aplica el horario calculado (ingreso, salida y almuerzo) a todos los dias marcados en el
// simulador, permitiendo asi horarios distintos por grupo de dias (ej. 8h entre semana y 5h el
// sabado): se corre el simulador una vez por cada grupo y se aplica cada vez.
function aplicarSimHorarioAlPatron(){
  const sim = state.turnos.simHorario;
  const salida = calcularHoraSalida(sim.horaIngreso, sim.horasTrabajo, sim.almuerzoMin);
  const patron = state.turnos.generador.patron;
  Object.keys(sim.dias).forEach(k=>{
    if(sim.dias[k]){
      patron[k].activo = true;
      patron[k].inicio = sim.horaIngreso;
      patron[k].fin = salida.horaTexto;
      patron[k].almuerzoInicio = sim.almuerzoInicio;
      patron[k].almuerzoMin = sim.almuerzoMin;
    }
  });
  state.turnos.diasLaboralesSemana = contarDiasActivosPatron();
  usarJornadaCalculada();
}

function setMesCompleto(){
  const g = state.turnos.generador;
  const base = d(g.fechaInicio || TODAY);
  const y = base.getFullYear(), m = base.getMonth();
  const primero = new Date(y, m, 1);
  const ultimo = new Date(y, m+1, 0);
  g.fechaInicio = isoDate(primero);
  g.fechaFin = isoDate(ultimo);
  render();
}
const DIAS_SEMANA_KEYS = ['dom','lun','mar','mie','jue','vie','sab']; // indice = Date.getDay()
// Genera una fila por CADA fecha del rango: los dias marcados como "trabaja" en el patron semanal
// quedan con su horario; los demas quedan como dia de descanso (pagado, sin horas ni recargos),
// para que el periodo completo quede visible y auditable de un vistazo.
function generarTurnosDesdePatron(){
  const g = state.turnos.generador;
  const inicio = d(g.fechaInicio);
  const fin = d(g.fechaFin);
  if(fin < inicio) return;
  const nuevos = [];
  let cursor = new Date(inicio);
  let guard = 0;
  while(cursor <= fin && guard < 400){
    const key = DIAS_SEMANA_KEYS[cursor.getDay()];
    const cfg = g.patron[key];
    if(cfg && cfg.activo){
      nuevos.push({
        fecha: isoDate(cursor), horaInicio: cfg.inicio, horaFin: cfg.fin,
        diaNoHabitual:false, esDescanso:false, almuerzoInicio: cfg.almuerzoInicio, almuerzoMin: cfg.almuerzoMin,
      });
    } else {
      nuevos.push({
        fecha: isoDate(cursor), horaInicio: '00:00', horaFin: '00:00',
        diaNoHabitual:false, esDescanso:true, almuerzoInicio: '12:00', almuerzoMin: 0,
      });
    }
    cursor.setDate(cursor.getDate()+1);
    guard++;
  }
  if(nuevos.length===0) return;
  state.turnos.lista = nuevos;
  render();
  window.scrollTo(0,0);
}
function aplicarTurnosASimulador(){
  const { tot } = calcularTotalesTurnos(state.turnos.lista, state.turnos.jornadaOrdinariaDiaria);
  const s = state.simulador;
  s.heDiurnas = Math.round(tot.heDiurnas*100)/100;
  s.heNocturnas = Math.round(tot.heNocturnas*100)/100;
  s.heDomDiurnas = Math.round(tot.heDomDiurnas*100)/100;
  s.heDomNocturnas = Math.round(tot.heDomNocturnas*100)/100;
  s.recNocturno = Math.round(tot.recNocturno*100)/100;
  s.recDomDiurno = Math.round(tot.recDomDiurno*100)/100;
  s.recDomNocturno = Math.round(tot.recDomNocturno*100)/100;
  state.activeTab = 'nomina';
  render();
  window.scrollTo(0,0);
}

function copiarPreguntaIA(){
  const texto = construirPreguntaIA();
  const marcarCopiado = () => { state.iaConsulta.copiado = true; render(); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto).then(marcarCopiado).catch(()=>copiarPreguntaIAFallback(texto, marcarCopiado));
  } else {
    copiarPreguntaIAFallback(texto, marcarCopiado);
  }
}
function copiarPreguntaIAFallback(texto, onOk){
  try{
    const ta = document.createElement('textarea');
    ta.value = texto;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if(ok) onOk();
    else render();
  }catch(e){
    render();
  }
}

// Abre la colilla en una ventana aparte, aislada del resto de la app (sin barra lateral, sin el
// layout flex principal), y lanza la impresión ahi. Esto evita que la disposicion de la pagina
// completa (sidebar, tabs, etc.) interfiera con lo que el navegador intenta imprimir, que es la
// causa mas comun de que "el boton de imprimir no funcione" o imprima algo distinto a la colilla.
// Abre cualquier seccion de resultados en una ventana aparte, aislada del resto de la app (sin
// barra lateral, sin el layout flex principal), y lanza la impresion ahi. Esto evita que la
// disposicion de la pagina completa interfiera con lo que el navegador intenta imprimir. Incluye
// automaticamente un encabezado con el titulo y la fecha, y un pie con el aviso de uso.
function imprimirSeccion(elId, titulo, extraCss){
  const el = document.getElementById(elId);
  if(!el){ try{ window.print(); }catch(e){} return; }
  try{
    const estilos = Array.from(document.querySelectorAll('style, link[rel="stylesheet"]')).map(n=>n.outerHTML).join('\n');
    const ventana = window.open('', '_blank', 'width=850,height=1000');
    if(!ventana){ try{ window.print(); }catch(e){} return; } // bloqueador de ventanas emergentes: fallback
    const fecha = fmtDateHuman(TODAY);
    ventana.document.open();
    ventana.document.write(
      '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>' + titulo + '</title>' +
      estilos +
      '<style>body{background:#fff;padding:28px;margin:0;} ' +
      '.print-wrap{max-width:900px;margin:0 auto;} ' +
      '.print-header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:18px;} ' +
      '.print-header .t{font-family:var(--display);font-weight:600;font-size:21px;color:var(--ink);} ' +
      '.print-header .d{font-family:var(--mono);font-size:12px;color:var(--ink-soft);} ' +
      '.print-footer{margin-top:26px;padding-top:12px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink-soft);line-height:1.6;} ' +
      '.card{border:none !important;padding:0 !important;margin-bottom:20px;} ' +
      'input[type=text],input[type=number],input[type=date],input[type=time],select{border:none !important;background:transparent !important;padding:0 !important;font-weight:600;} ' +
      'button{display:none !important;}' +
      (extraCss||'') +
      '</style></head><body><div class="print-wrap">' +
      '<div class="print-header"><div class="t">' + titulo + '</div><div class="d">' + fecha + '</div></div>' +
      el.outerHTML +
      '<div class="print-footer">Documento generado con la calculadora Nómina Colombia — herramienta de consulta y estudio, sin validez legal, contable ni de facturación electrónica. No reemplaza asesoría profesional ni un sistema oficial de nómina. Diseñado y desarrollado por anacrojassz, con IA (Claude · Anthropic).</div>' +
      '</div></body></html>'
    );
    ventana.document.close();
    const lanzarImpresion = () => { try{ ventana.focus(); ventana.print(); }catch(e){} };
    ventana.onload = lanzarImpresion;
    setTimeout(lanzarImpresion, 350); // respaldo por si onload no se dispara a tiempo
  }catch(e){
    try{ window.print(); }catch(e2){}
  }
}

  const jornadaCalcDecimal = jornadaDiariaCalculada();

    <div class="result-strip" style="margin-top:12px;">
      <div class="result-box"><div class="k">Horas entre semana (c/día)</div><div class="v">${horasEntreSemana.toFixed(2)}</div></div>
      <div class="result-box total"><div class="k">Horas el ${diasCortosN>1?'resto de días':'sábado'} (para completar)</div><div class="v">${horasDiaCorto.toFixed(2)}</div></div>

                ${[0,30,45,60,90,120].map(m=>`<option value="${m}" ${cfg.almuerzoMin===m?'selected':''}>${m===0?'Sin descanso':m+' min'}</option>`).join('')}
              </select>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>

    <button class="btn gold" style="margin-top:14px;" onclick="generarTurnosDesdePatron()">Generar turnos para este período →</button>
    <p class="note">Esto reemplaza la lista de turnos de abajo con un día por cada fecha del período: los días marcados como "trabaja" quedan con su horario, y los demás quedan marcados como "Descanso" (se pagan como día ordinario, sin horas ni recargos) — así puedes revisar el período completo de un vistazo y ajustar cualquier día puntual después. Si un empleado no tiene horario fijo, puedes ignorar esta sección y agregar los turnos manualmente uno por uno.</p>
  </div>

  <div class="card">
    <div class="section-label">4. Turnos del período</div>
    <table>
      <thead><tr>
        <th>Fecha</th><th>Hora entrada</th><th>Hora salida</th>
        <th>Inicio almuerzo</th><th>Almuerzo</th>
        <th>Descanso<br/><span style="font-weight:400;text-transform:none;">(paga como día ordinario)</span></th>
        <th>Día no habitual<br/><span style="font-weight:400;text-transform:none;">(todo extra)</span></th>
        <th>Día</th><th class="num">Horas pagadas</th><th></th>
      </tr></thead>
      <tbody>
        ${lista.map((t,i)=>{
          const festivo = esDomingoOFestivo(t.fecha);
          const r = detalle[i];
          const dis = t.esDescanso ? 'disabled' : '';
          return `<tr${t.esDescanso?' style="background:var(--paper-alt);"':''}>
            <td><input type="date" value="${t.fecha}" data-key="turnos.${i}.fecha" oninput="updTurno(${i},'fecha',this.value)"/></td>
            <td><input type="time" value="${t.horaInicio}" data-key="turnos.${i}.horaInicio" ${dis} oninput="updTurno(${i},'horaInicio',this.value)"/></td>
            <td><input type="time" value="${t.horaFin}" data-key="turnos.${i}.horaFin" ${dis} oninput="updTurno(${i},'horaFin',this.value)"/></td>
            <td><input type="time" value="${t.almuerzoInicio||'12:00'}" data-key="turnos.${i}.almuerzoInicio" ${dis} oninput="updTurno(${i},'almuerzoInicio',this.value)"/></td>
            <td>
              <select data-key="turnos.${i}.almuerzoMin" ${dis} onchange="updTurno(${i},'almuerzoMin',this.value)">
                ${[0,30,45,60,90,120].map(m=>`<option value="${m}" ${((t.almuerzoMin||0)===m)?'selected':''}>${m===0?'Sin descanso':m+' min'}</option>`).join('')}
              </select>
            </td>
            <td style="text-align:center;">
              <input type="checkbox" data-key="turnos.${i}.esDescanso" ${t.esDescanso?'checked':''}
                onchange="updTurno(${i},'esDescanso',this.checked)"/>
            </td>
            <td style="text-align:center;">
              <input type="checkbox" data-key="turnos.${i}.diaNoHabitual" ${t.diaNoHabitual?'checked':''} ${dis}
                onchange="updTurno(${i},'diaNoHabitual',this.checked)"/>
            </td>
            <td>${t.esDescanso?'<span class="tag grey">Descanso</span>':(festivo?'<span class="tag gold">Dom/Festivo</span>':'<span class="tag green">Hábil</span>')}</td>
            <td class="num">${r.totalHoras.toFixed(2)}</td>
            <td style="white-space:nowrap;">
              <button class="btn ghost small" title="Copiar este horario a las demás filas" onclick="aplicarHorarioATodos(${i})">↧ A todas</button>
              <button class="btn ghost small" title="Duplicar esta fila al día siguiente" onclick="duplicarTurno(${i})">⧉</button>
              ${lista.length>1?`<button class="btn danger small" onclick="removeTurno(${i})">✕</button>`:''}
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    <button class="btn ghost" style="margin-top:12px;" onclick="addTurno()">+ Agregar turno manualmente</button>
    <p class="note">El tiempo de almuerzo se descuenta y no genera pago. Marca <b>"Descanso"</b> en el día de descanso semanal remunerado (o cualquier día que se paga sin trabajarlo) — ese día no genera horas ni recargos, se paga como un día ordinario dentro del salario mensual. Marca <b>"Día no habitual"</b> solo cuando el turno completo fue adicional al horario normal del empleado (por ejemplo, lo llamaron un día libre) — en ese caso todas sus horas se calculan como extra, sin aplicar el umbral de horas ordinarias. El botón <b>"↧ A todas"</b> copia el horario de esa fila a todas las demás filas trabajadas (útil si casi todos los días tienen el mismo horario); el botón <b>"⧉"</b> duplica la fila al día siguiente, para que solo tengas que ajustar la fecha si cambia algo puntual.</p>
  </div>

  <div id="resultado-horarios" class="card">
    <div class="section-label">Totales del período — listos para el Simulador de Nómina</div>
    <table>
      <tbody>
        <tr><td>Horas extra diurnas</td><td class="num">${tot.heDiurnas.toFixed(2)}</td></tr>
        <tr><td>Horas extra nocturnas</td><td class="num">${tot.heNocturnas.toFixed(2)}</td></tr>
        <tr><td>Horas extra dominicales/festivas diurnas</td><td class="num">${tot.heDomDiurnas.toFixed(2)}</td></tr>
        <tr><td>Horas extra dominicales/festivas nocturnas</td><td class="num">${tot.heDomNocturnas.toFixed(2)}</td></tr>
        <tr><td>Horas de recargo nocturno ordinario</td><td class="num">${tot.recNocturno.toFixed(2)}</td></tr>
        <tr><td>Horas de recargo dominical/festivo diurno</td><td class="num">${tot.recDomDiurno.toFixed(2)}</td></tr>
        <tr><td>Horas de recargo dominical/festivo nocturno</td><td class="num">${tot.recDomNocturno.toFixed(2)}</td></tr>
        <tr class="total"><td>Total de horas con algún tipo de recargo o extra</td><td class="num">${extrasTotal.toFixed(2)}</td></tr>
      </tbody>
    </table>
  </div>

  <div class="no-print">
    <button class="btn ghost small" onclick="imprimirSeccion('resultado-horarios','Totales de Turnos y Horarios')">🖨 Imprimir estos totales</button>
    <button class="btn gold" onclick="aplicarTurnosASimulador()">Aplicar estos totales al Simulador de Nómina →</button>
  </div>
  `;
}

function renderNomina(){
  const s = state.simulador;
  const salarioEfectivo = s.modoPago==='jornal' ? Math.round((s.jornalValor||0)*30) : s.salario;
  const r = liquidarPeriodo({
    salario:salarioEfectivo, fecha:s.fecha, diasLaborados:s.dias, recibeAux:s.recibeAux,
    heDiurnas:s.heDiurnas, heNocturnas:s.heNocturnas, heDomDiurnas:s.heDomDiurnas, heDomNocturnas:s.heDomNocturnas,
    recNocturno:s.recNocturno, recDomDiurno:s.recDomDiurno, recDomNocturno:s.recDomNocturno,
    bonificaciones:s.bonificaciones, prestamos:s.prestamos, otrosDescuentos:s.otrosDescuentos,
    exoneradoParafiscales:s.exonerado, claseRiesgo:s.claseRiesgo,
  });

  if(s.vista==='colilla') return renderColilla(s, r);

  const rows = [
    ['Salario devengado (proporcional)', r.salarioDevengado, '—', '—'],
    ['Auxilio de transporte', r.auxProporcional, '—', '—'],
    ['Horas extra diurnas (25%)', r.valorHeDiurnas, s.heDiurnas, s.heDiurnas? r.valorHeDiurnas/s.heDiurnas : null],
    ['Horas extra nocturnas (75%)', r.valorHeNocturnas, s.heNocturnas, s.heNocturnas? r.valorHeNocturnas/s.heNocturnas : null],
    ['H.E. dominicales/festivas diurnas', r.valorHeDomDiurnas, s.heDomDiurnas, s.heDomDiurnas? r.valorHeDomDiurnas/s.heDomDiurnas : null],

    ['Recargo nocturno ordinario (35%)', r.valorRecNocturno, s.recNocturno, s.recNocturno? r.valorRecNocturno/s.recNocturno : null],
    ['Recargo dominical/festivo diurno', r.valorRecDomDiurno, s.recDomDiurno, s.recDomDiurno? r.valorRecDomDiurno/s.recDomDiurno : null],

      ${fieldText('simulador','cedula','Cédula', s.cedula)}

  </div>

  <div class="card">
    <div class="section-label">Datos del período</div>

      <div class="field"><label>Tipo de pago</label>

        <tr><td>Interés moratorio estimado</td><td class="num">${fmt0(rm.interesEstimado)}</td></tr>
        <tr class="total"><td>Total estimado que el empleador tendría que asumir</td><td class="num">${fmt0(rm.totalEstimado)}</td></tr>

    <p class="note">Esta es una estimación de referencia, no un cálculo legal ni actuarial exacto. Además de este valor, si el empleado se enferma, sufre un accidente laboral o llega a la edad de pensión durante un período sin aportes pagados, el empleador debe asumir directamente esos costos (atención médica, incapacidades, pensión de invalidez) con su propio patrimonio, como si fuera la EPS, la ARL o el fondo de pensiones. La UGPP puede además imponer sanciones independientes de este cálculo. La tasa de interés moratorio real la calcula el operador de PILA al momento del pago — verifica el valor exacto ahí antes de negociar o presupuestar. Ver la pestaña Normativa Legal para el detalle y las fuentes.</p>
  </div>

  <div class="card">
    <div class="section-label">Horas extra y recargos del período</div>

      ${fieldNumber('simulador','heDomNocturnas','H.E. dom/fest nocturnas (h)', s.heDomNocturnas, {step:0.5})}
      ${fieldNumber('simulador','recNocturno','Recargo nocturno ordinario (h)', s.recNocturno, {step:0.5})}

// Envuelve doRender() para que, al reconstruir el DOM en cada tecla,
// el campo donde la persona está escribiendo conserve el foco y la
// posición del cursor (si no, cada tecla obliga a volver a hacer clic).
function render(){
  const active = document.activeElement;
  let key = null, selFromEnd = null;
  if (active && active.getAttribute) key = active.getAttribute('data-key');
  if (key && typeof active.selectionStart === 'number') {
    selFromEnd = active.value.length - active.selectionStart;
  }
  doRender();
  if (key) {
    const all = document.querySelectorAll('[data-key]');
    let el = null;
    for (const c of all) { if (c.getAttribute('data-key') === key) { el = c; break; } }
    if (el) {
      el.focus();
      if (selFromEnd !== null) {
        try {
          const pos = Math.max(0, el.value.length - selFromEnd);
          el.setSelectionRange(pos, pos);
        } catch (e) { /* algunos inputs (type=number) no soportan seleccion */ }
      }
    }
  }
}
render();
